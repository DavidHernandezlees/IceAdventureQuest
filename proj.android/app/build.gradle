plugins {
    id 'com.android.application'
}
def supportedAbis = ['arm64-v8a', 'armeabi-v7a', 'x86']
def requestedAbi = providers.gradleProperty('gameAbi').orNull
if (requestedAbi && !supportedAbis.contains(requestedAbi)) {
    throw new GradleException("Unsupported gameAbi: ${requestedAbi}")
}

def adsApp = providers.gradleProperty('admobAppId').orElse('').get()
def adsUnit = providers.gradleProperty('rewardedAdUnitId').orElse('').get()
def storeKey = providers.gradleProperty('playBillingPublicKey').orElse('').get()
def sampleApp = 'ca-app-pub-3940256099942544~3347511713'

android {
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    namespace 'com.iceadventurequest.game'
    compileSdk 35
    ndkVersion '19.2.5345600'
    defaultConfig {
        applicationId 'com.iceadventurequest.frosttrail'
        minSdk 23
        targetSdk 28
        versionCode 7
        versionName '1.4.2'
        manifestPlaceholders = [adsAppId: adsApp ?: sampleApp]
        buildConfigField 'String', 'BILLING_KEY', groovy.json.JsonOutput.toJson(storeKey)
        buildConfigField 'String', 'VIDEO_UNIT', groovy.json.JsonOutput.toJson(adsApp ? adsUnit : '')
        ndk { abiFilters.addAll(requestedAbi ? [requestedAbi] : supportedAbis) }
        externalNativeBuild {
            cmake { arguments '-DANDROID_STL=c++_static' }
        }
    }
    buildTypes {
        debug {
            manifestPlaceholders = [adsAppId: sampleApp]
            buildConfigField 'String', 'VIDEO_UNIT', '"ca-app-pub-3940256099942544/5224354917"'
            if (project.hasProperty('resourcePreview')) applicationIdSuffix '.resources'
        }
    }
    externalNativeBuild {
        cmake {
            path rootProject.file('CMakeLists.txt')
            version '3.22.1'
        }
    }
    sourceSets.main.assets.srcDirs = ['src/main/assets', rootProject.file('Resources')]
}
dependencies {
    implementation project(':cocos-android')
    implementation 'com.google.android.gms:play-services-ads:24.9.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    implementation 'com.android.billingclient:billing:8.0.0'
}
